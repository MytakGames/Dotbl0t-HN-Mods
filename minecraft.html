<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dotBL0t Minecraft Mods</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Creepster&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--card:#1f1a16;--line:#3a322a;--text:#f3ead8;--muted:#cfc5b4;--accent:#ff8a2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}
a{color:var(--text)}a:hover{color:#ffb070}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}
.logo span{color:var(--accent)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.links a{text-decoration:none;padding:12px 14px;font-size:15px;color:var(--muted)}
.lang{display:flex;margin-left:8px;border:1.5px solid #5b5246;border-radius:8px;overflow:hidden}
.lang button{min-width:56px;padding:11px 14px;border:0;cursor:pointer;font:600 14px Inter,system-ui,sans-serif;background:transparent;color:var(--text)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#14110f}
.hero{display:flex;flex-wrap:wrap;gap:48px;align-items:center;padding:64px 0 56px}
.hero .txt{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(40px,6vw,64px);line-height:1.03;letter-spacing:-.025em}
.hero p{margin:0;font-size:19px;line-height:1.55;color:var(--muted);max-width:540px}
.btns{display:flex;flex-wrap:wrap;gap:12px;padding-top:8px}
.btn{text-decoration:none;font-weight:600;font-size:16px;padding:14px 26px;border-radius:6px;border:1.5px solid #5b5246}
.btn.primary{background:var(--accent);color:#14110f;border-color:var(--accent)}
.btn.primary:hover{color:#14110f;filter:brightness(1.1)}
.hero .pic{flex:1 1 360px;min-width:0}
.hero .pic div{width:100%;max-width:480px;aspect-ratio:1/1;margin:0 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.hero .pic img{width:100%;height:100%;object-fit:cover;display:block}
.stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:72px}
.stat{flex:1 1 220px;padding:28px 24px;display:flex;flex-direction:column;gap:6px}
.stat b{font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:1;color:var(--accent)}
.stat span{font-size:15px;color:var(--muted)}
h2{font-size:44px;letter-spacing:-.02em}
.sec-intro{display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
.sec-intro p{margin:0;font-size:17px;line-height:1.55;color:var(--muted);max-width:600px}
.grid{display:flex;flex-wrap:wrap;gap:24px;padding-bottom:80px}
.card{flex:1 1 320px;max-width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#2a231d}
.card .body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.card h3{font-size:24px;overflow-wrap:anywhere}
.card p{margin:0;font-size:16px;line-height:1.55;color:var(--muted);flex:1}
.card a{color:var(--accent);font-weight:600;font-size:15px;text-decoration:none;padding:8px 0}
.card .soon{align-self:flex-start;margin:8px 0;padding:6px 12px;border:1.5px solid var(--accent);border-radius:6px;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.how{background:#1b1613;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.how .wrap{display:flex;flex-wrap:wrap;gap:56px;padding-top:80px;padding-bottom:80px}
.how .l{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px}
.how .l p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
.how .r{flex:1 1 380px;min-width:0}
.step{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step i{font:700 28px 'Space Grotesk',sans-serif;color:var(--accent);width:36px;flex:none;font-style:normal}
.step b{display:block;font-size:18px;margin-bottom:4px}
.step span{font-size:16px;line-height:1.5;color:var(--muted)}
.end{padding:88px 0;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.end h2{font-size:clamp(34px,5vw,52px);line-height:1.05;max-width:720px}
.end p{margin:0;font-size:18px;line-height:1.55;color:var(--muted);max-width:560px}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:28px;padding-bottom:28px;font-size:14px;color:#a99f90}
.tabs{display:flex;gap:8px;padding:8px 0 0;border-bottom:1px solid var(--line)}
.tabs button{padding:14px 22px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font:600 16px 'Space Grotesk',sans-serif}
.tabs a{padding:14px 22px;border-bottom:3px solid transparent;color:var(--muted);font:600 16px 'Space Grotesk',sans-serif;text-decoration:none}
.tabs a[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab-games{padding-top:56px}
.card .tag{align-self:flex-start;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.zlogo{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2a0d0d,#0a0505);font-family:Creepster,Impact,sans-serif;text-align:center;line-height:.95;padding:12px}
.zlogo b,.zlogo i{font-style:normal;font-weight:400;-webkit-background-clip:text;background-clip:text;color:transparent}
.zlogo .zr{font-size:clamp(56px,13vw,96px);background-image:linear-gradient(#ff3b30,#8c0a05);filter:drop-shadow(0 0 8px rgba(255,50,30,.45))}
.zlogo i{font-size:42px;background-image:linear-gradient(#ff5a3c,#c0301c)}
.zlogo .zg{font-size:clamp(44px,10.5vw,76px);background-image:linear-gradient(#c9d9a0,#6f8a4a);filter:drop-shadow(0 0 8px rgba(200,230,150,.3))}
.poll{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:560px;display:flex;flex-direction:column;gap:12px;margin-bottom:48px}
.poll h3{font-size:22px}
.popt{padding:14px 18px;border:1.5px solid #5b5246;border-radius:8px;background:transparent;color:var(--text);font:600 16px Inter,system-ui,sans-serif;cursor:pointer;text-align:left}
.popt:hover{border-color:var(--accent)}
.pres{position:relative;display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pres .pbar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,138,43,.22)}
.pres span,.pres b{position:relative}
.pres.mine{border-color:var(--accent)}
.poll small{color:var(--muted)}
.polls-h{font-size:32px;margin:8px 0 20px}
</style>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
var NS='dotbl0t-hn-mods';
var POLLS=[{id:'horde',q:['Would you play Horde of Zombies?','Giocheresti a Horde of Zombies?'],o:[['Yes, sounds great!','Sì, mi piace!'],['Maybe','Forse'],['Not for me','Non fa per me']]},{id:'hordeprice',q:['Is $5.50 a fair price for Horde of Zombies?','Va bene 5,50 $ come prezzo per Horde of Zombies?'],o:[['Yes, fair price','Sì, prezzo giusto'],['Too expensive','Troppo caro'],['Too cheap','Troppo poco']]}];
var PC={},OFF={},CUR='en',LOADED={};
function pkey(p,i){return 'p-'+p.id+'-'+i;}
function pget(p,i){return fetch('https://abacus.jasoncameron.dev/get/'+NS+'/'+pkey(p,i)).then(function(r){if(r.status===404)return 0;if(!r.ok)throw new Error('bad');return r.json().then(function(j){return j.value||0;});});}
function pload(p){return Promise.all(p.o.map(function(x,i){return pget(p,i);})).then(function(a){PC[p.id]=a;OFF[p.id]=false;}).catch(function(){OFF[p.id]=true;});}
function pvoted(p){try{var v=localStorage.getItem('poll-'+p.id);return v===null?-1:parseInt(v,10);}catch(e){return -1;}}
function pvote(p,i){try{localStorage.setItem('poll-'+p.id,String(i));}catch(e){}var c=PC[p.id]=PC[p.id]||p.o.map(function(){return 0;});c[i]++;renderPolls(CUR);fetch('https://abacus.jasoncameron.dev/hit/'+NS+'/'+pkey(p,i)).then(function(r){if(!r.ok)throw new Error('bad');return r.json();}).then(function(j){PC[p.id][i]=j.value;OFF[p.id]=false;renderPolls(CUR);}).catch(function(){OFF[p.id]=true;renderPolls(CUR);});}
function renderPolls(lang){
  CUR=lang;var el=document.getElementById('polls');if(!el)return;var L=lang==='it'?1:0;
  el.innerHTML='<h2 class="polls-h">'+(L?'Sondaggi':'Polls')+'</h2>'+POLLS.map(function(p){
    var v=pvoted(p);var cc=(PC[p.id]||[]).slice();while(cc.length<p.o.length)cc.push(0);if(v>=0&&cc[v]<1)cc[v]=1;
    var off=!!OFF[p.id];var tot=cc.reduce(function(a,b){return a+b;},0);
    var h='<div class="poll"><h3>'+esc(p.q[L])+'</h3>';
    h+=p.o.map(function(o,i){
      if(v<0)return '<button class="popt" data-p="'+p.id+'" data-i="'+i+'">'+esc(o[L])+'</button>';
      var pct=off?(i===v?100:0):(tot?Math.round(cc[i]*100/tot):0);
      return '<div class="pres'+(i===v?' mine':'')+'"><div class="pbar" style="width:'+pct+'%"></div><span>'+esc(o[L])+'</span><b>'+(off?(i===v?(L?'Il tuo voto':'Your vote'):''):pct+'%')+'</b></div>';
    }).join('');
    if(v>=0)h+='<small>'+(off?(L?'Risultati in tempo reale non disponibili ora. Il tuo voto è salvato su questo dispositivo.':'Live results are unavailable right now. Your vote is saved on this device.'):(L?'Grazie per aver votato! Voti totali: ':'Thanks for voting! Total votes: ')+tot)+'</small>';
    return h+'</div>';
  }).join('');
  el.querySelectorAll('.popt').forEach(function(b){b.onclick=function(){var p=POLLS.filter(function(x){return x.id===b.getAttribute('data-p');})[0];pvote(p,parseInt(b.getAttribute('data-i'),10));};});
  POLLS.forEach(function(p){if(!LOADED[p.id]){LOADED[p.id]=1;pload(p).then(function(){renderPolls(CUR);});}});
}
function render(lang){
  var t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t[el.getAttribute('data-t')];});
  document.getElementById('grid').innerHTML=MODS.map(function(m){
    var d=lang==='it'?m[4]:m[3];
    var foot=m[1]?'<a href="https://steamcommunity.com/sharedfiles/filedetails/?id='+m[1]+'">'+t.cta+'</a>':'<span class="soon">'+t.soon+'</span>';
    return '<div class="card"><img src="'+m[2]+'" alt="'+esc(m[0])+'"><div class="body"><h3>'+esc(m[0])+'</h3><p>'+esc(d)+'</p>'+foot+'</div></div>';
  }).join('');
  document.getElementById('ggrid').innerHTML=GAMES.map(function(g){
    var d=lang==='it'?g[4]:g[3];
    var foot=(g[7]||!g[1]?'<span class="soon">'+(g[7]?g[7][lang==='it'?1:0]:t.gsoon)+'</span>':'')+(g[1]?'<a href="'+g[1]+'">'+(g[8]?g[8][lang==='it'?1:0]:t.cta)+'</a>':'');
    return '<div class="card">'+(g[2]==='zlogo'?'<div class="zlogo"><b class="zr">HORDE</b><i>OF</i><b class="zg">ZOMBIES</b></div>':'<img src="'+g[2]+'" alt="'+esc(g[0])+'">')+'<div class="body"><span class="tag">'+esc(lang==='it'&&g[6]?g[6]:g[5])+'</span><h3>'+esc(g[0])+'</h3><p>'+esc(d)+'</p>'+foot+'</div></div>';
  }).join('');
  document.getElementById('mcgrid').innerHTML=MC.map(function(m){
    var d=lang==='it'?m[4]:m[3];
    return '<div class="card"><img src="'+m[2]+'" alt="'+esc(m[0])+'"><div class="body"><span class="tag">'+esc(lang==='it'?m[6]:m[5])+'</span><h3>'+esc(m[0])+'</h3><p>'+esc(d)+'</p><a href="'+m[1]+'">'+t.cfcta+'</a></div></div>';
  }).join('');
  renderPolls(lang);
  document.getElementById('en').setAttribute('aria-pressed',lang==='en');
  document.getElementById('it').setAttribute('aria-pressed',lang==='it');
  try{localStorage.setItem('lang',lang);}catch(e){}
}
function setTab(n){var m=n==='mods',g=n==='games',c=n==='mc';document.getElementById('paneMods').style.display=m?'':'none';document.querySelector('.how').style.display=m?'':'none';document.querySelector('.end').style.display=m?'':'none';document.getElementById('games').style.display=g?'':'none';document.getElementById('mc').style.display=c?'':'none';document.getElementById('tabMods').setAttribute('aria-pressed',m);document.getElementById('tabGames').setAttribute('aria-pressed',g);document.getElementById('tabMc').setAttribute('aria-pressed',c);}
document.getElementById('en').onclick=function(){render('en');};
document.getElementById('it').onclick=function(){render('it');};
var L0='en';try{L0=localStorage.getItem('lang')||'en';}catch(e){}
render(L0==='it'?'it':'en');
setTab(PAGE);
var TABS={mods:['index.html','dotBL0t Hello Neighbor Mods'],games:['games.html','dotBL0t Games'],mc:['minecraft.html','dotBL0t Minecraft Mods']};
function pageFromUrl(){var p=location.pathname;return /games/.test(p)?'games':/minecraft/.test(p)?'mc':'mods';}
function go(n,push){setTab(n);document.title=TABS[n][1];if(push){try{history.pushState({n:n},'',TABS[n][0]);}catch(e){}}window.scrollTo(0,0);}
[['tabMods','mods'],['tabGames','games'],['tabMc','mc']].forEach(function(x){document.getElementById(x[0]).addEventListener('click',function(e){if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();go(x[1],true);});});
window.addEventListener('popstate',function(){go(pageFromUrl(),false);});
</script>
